- name: Версия и пароль заданы
  ansible.builtin.assert:
    that:
      - app_tag is defined
      - postgres_password | length > 0
    fail_msg: >-
      Нужны -e app_tag=vX.Y.Z и POSTGRES_PASSWORD в окружении.
      Локально: set -a; source secrets.env; set +a.
      В пайплайне: секрет POSTGRES_PASSWORD в настройках репозитория
    quiet: true

- name: Каталоги проекта
  ansible.builtin.file:
    path: "{{ app_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - nginx
    - backups

- name: docker-compose.yml и конфиг nginx
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../{{ item }}"
    dest: "{{ app_dir }}/{{ item }}"
    mode: "0644"
  loop:
    - docker-compose.yml
    - nginx/site.conf

# diff: false, чтобы пароль не попал в вывод при запуске с --diff
- name: .env с версией и паролем
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    mode: "0600"
  diff: false

- name: Запущена ли уже база
  ansible.builtin.command: docker compose ps --status running --quiet postgres
  args:
    chdir: "{{ app_dir }}"
  register: db_running
  changed_when: false

# Упал дамп, упал плейбук, и до обновления контейнеров дело не доходит
- name: Дамп базы перед обновлением
  ansible.builtin.shell: >-
    docker compose exec -T postgres
    pg_dump -U {{ postgres_user }} --clean --if-exists {{ postgres_db }}
    > backups/before-{{ app_tag }}-{{ ansible_facts['date_time']['iso8601_basic_short'] }}.sql
  args:
    chdir: "{{ app_dir }}"
  when: db_running.stdout | length > 0

- name: Поднять стек
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    pull: missing
    wait: true
    wait_timeout: 120
