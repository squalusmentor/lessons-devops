apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ec-mongodb-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ec-mongodb
spec:
  replicas: 1
  # Две монги на одном каталоге данных не уживутся, поэтому старый под
  # останавливается до старта нового
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ec-mongodb
  template:
    metadata:
      labels:
        app: ec-mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          args: [mongod, --quiet]
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          readinessProbe:
            tcpSocket:
              port: 27017
          resources:
            requests:
              memory: 208Mi
            limits:
              memory: 512Mi
              cpu: 250m
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ec-mongodb-data
---
apiVersion: v1
kind: Service
metadata:
  name: ec-mongodb
spec:
  selector:
    app: ec-mongodb
  ports:
    - port: 27017
