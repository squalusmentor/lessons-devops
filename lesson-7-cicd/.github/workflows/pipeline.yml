name: pipeline

on:
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    # Та же версия python, что в backend/Dockerfile: линтер проверяет код
    # на том языке, на котором он будет работать в проде
    container: python:3.13-slim
    steps:
      - uses: actions/checkout@v5
      - run: pip install ruff==0.16.9
      - run: ruff check backend

  build:
    needs: lint
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          build-args: APP_VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/events:${{ github.ref_name }}

  deploy:
    needs: build
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
