services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      EVENT_LIMIT: ${EVENT_LIMIT:-100}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
