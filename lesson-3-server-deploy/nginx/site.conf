# Тот же конфиг, что в уроке 2, плюс второй server { } на 443.
# server_name _ — «любой Host-заголовок», у нас пока нет домена, есть только IP.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Сертификат и ключ — их кладёт certs/generate.sh на этапе сборки образа
    ssl_certificate     /etc/nginx/certs/site.crt;
    ssl_certificate_key /etc/nginx/certs/site.key;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
