<!-- SVG — картинка, описанная ТЕКСТОМ. Её можно открыть блокнотом и поправить руками.
     Поэтому она весит копейки и не пикселится при увеличении. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fca7e6"/>
      <stop offset="100%" stop-color="#72f7fc"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="url(#g)" stroke-width="4"/>
  <path d="M20 42 L28 22 L36 42 M23 34 H33" fill="none" stroke="url(#g)"
        stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="45" cy="40" r="4" fill="url(#g)"/>
</svg>
