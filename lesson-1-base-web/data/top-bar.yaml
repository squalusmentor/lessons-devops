# Содержимое верхней панели. Тексты отделены от вёрстки:
# правишь yaml — меняется меню на всех страницах, HTML трогать не надо.

logo:
  href: "/"
  image: "/images/logo.svg"
  alt: "Lesson 1"

buttons:
  - name: "Главная"
    href: "/"

  - name: "Путь запроса"
    href: "/about/"

  # ведёт в никуда — чтобы посмотреть на 404
  - name: "Битая ссылка"
    href: "/no-such-page/"

  # редирект 301, настроен в hugo.toml
  - name: "Редирект"
    href: "/old-page"
