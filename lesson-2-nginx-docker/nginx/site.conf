# Конфиг нашего сайта. Внутри контейнера лежит в /etc/nginx/conf.d/site.conf,
# главный /etc/nginx/nginx.conf подхватывает его строкой include conf.d/*.conf;
#
# Каждая директива заканчивается ; — забудешь, nginx не стартует.
# Проверить синтаксис не запуская:  nginx -t

server {
    # На каком порту слушать ВНУТРИ контейнера. Наружу его пробрасывает docker.
    listen 80;

    # Для какого домена этот блок. Блоков server может быть много на одном порту —
    # nginx выберет нужный по заголовку Host из запроса. Так один сервер держит
    # несколько сайтов.
    server_name localhost;

    # ГДЕ ЛЕЖАТ ФАЙЛЫ. Запрос /css/style.css -> /usr/share/nginx/html/css/style.css
    root /usr/share/nginx/html;

    # Какой файл внутри папки отдавать, если запросили папку: /about/ -> /about/index.html
    # Клиент при этом видит в адресной строке /about/ — про index.html он не знает.
    # Это и есть «человеческие» URL без .html на конце.
    index index.html;

    # location — что делать с запросом. Здесь: с любым.
    location / {
        # try_files: пробуй по очереди, что найдётся первым — то и отдай.
        #   $uri   — файл как есть      (/css/style.css)
        #   $uri/  — папка с index.html (/about/ -> /about/index.html)
        #   =404   — ничего не нашлось, отдай 404
        try_files $uri $uri/ =404;
    }

    # Своя страница 404 вместо стандартной от nginx (её собрал Hugo в уроке 1)
    error_page 404 /404.html;
}
