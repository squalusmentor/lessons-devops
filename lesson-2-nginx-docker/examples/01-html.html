<!-- HTML — СТРУКТУРА. Открой этот файл двойным кликом: браузер покажет его без всякого сервера. -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>1. Только HTML</title>
</head>
<body>

  <h1>Заголовок</h1>
  <p>Абзац текста. <b>Жирный</b>, <i>курсив</i>, <a href="https://example.com">ссылка</a>.</p>

  <ul>
    <li>пункт списка</li>
    <li>ещё пункт</li>
  </ul>

  <button type="button">Кнопка</button>

  <!-- Всё выглядит уныло и одинаково: это вид страницы БЕЗ CSS.
       HTML отвечает только за то, ЧТО есть на странице и в каком порядке. -->

</body>
</html>
